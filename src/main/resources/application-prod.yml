## 生产环境数据库配置（线上PostgreSQL）
#spring:
#  datasource:
#    url: jdbc:postgresql://prod-db-host:5432/aio_prod  # 线上数据库地址（替换为实际地址）
#    username: ${DB_USERNAME}  # 从环境变量获取用户名（安全起见，不硬编码）
#    password: ${DB_PASSWORD}  # 从环境变量获取密码
#    driver-class-name: org.postgresql.Driver
#    hikari:  # 连接池配置（生产环境必须优化）
#      maximum-pool-size: 20  # 最大连接数
#      minimum-idle: 5  # 最小空闲连接
#      idle-timeout: 300000  # 空闲超时（5分钟）
#      connection-timeout: 20000  # 连接超时（20秒）
#  jpa:
#    hibernate:
#      ddl-auto: none  # 生产环境禁用自动建表（通过 Liquibase 管理）
#    show-sql: false  # 生产环境不打印SQL（避免性能损耗）
#
