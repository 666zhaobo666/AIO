server:
  port: 8080

# 开发环境数据库配置（PostgreSQL）
# 需要设置环境变量: DB_USERNAME, DB_PASSWORD
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}  # 数据库地址（aio_dev为开发库名）
    username: ${DB_USERNAME}  # 环境变量 DB_USERNAME
    password: ${DB_PASSWORD}  # 环境变量 DB_PASSWORD
    driver-class-name: org.postgresql.Driver  # PostgreSQL驱动
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境自动更新表结构（生产环境禁用）
    show-sql: true  # 开发环境打印SQL（方便调试）

# JWT 配置
# 需要设置环境变量: JWT_SECRET, JWT_EXPIRE_DAYS
aio:
  jwt:
    secret: ${JWT_SECRET}  # 环境变量 JWT_SECRET（生产环境务必更换）
    expire-days: 7  # 环境变量 JWT_EXPIRE_DAYS（令牌过期天数）

# 日志配置（开发环境日志级别更详细）
logging:
  level:
    root: INFO
    com.aio: DEBUG  # 项目包日志级别为DEBUG
    org.springframework.security: DEBUG  # 安全框架日志（方便调试登录权限）
    org.hibernate.SQL: DEBUG  # 打印SQL语句
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # 打印SQL参数
