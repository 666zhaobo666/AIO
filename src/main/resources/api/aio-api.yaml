    /api/fts/tunnel/user/assign:
        post:
            tags: [ FTS ]
            summary: 分配用户隧道权限
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserTunnelDto'
            responses:
                '200':
                    description: 分配成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/tunnel/user/list:
        post:
            tags: [ FTS ]
            summary: 查询用户隧道权限列表
            description: 需要管理员角色（@RequireRole）
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserTunnelQueryDto'
            responses:
                '200':
                    description: 成功，返回用户隧道权限列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/tunnel/user/remove:
        post:
            tags: [ FTS ]
            summary: 删除用户隧道权限
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int32
                            required:
                                - id
            responses:
                '200':
                    description: 删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/tunnel/user/update:
        post:
            tags: [ FTS ]
            summary: 更新用户隧道权限
            description: 包含流量、流量重置时间、到期时间、状态等；需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserTunnelUpdateDto'
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/tunnel/user/tunnel:
        post:
            tags: [ FTS ]
            summary: 获取当前用户可用的隧道
            security:
                -   bearerAuth: [ ]
            responses:
                '200':
                    description: 成功，返回当前用户可用隧道列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/tunnel/diagnose:
        post:
            tags: [ FTS ]
            summary: 隧道诊断
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tunnelId:
                                    type: integer
                                    format: int64
                            required:
                                - tunnelId
            responses:
                '200':
                    description: 成功，返回诊断结果
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

