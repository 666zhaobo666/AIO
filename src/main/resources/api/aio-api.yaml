                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/forward/resume:
        post:
            tags: [ FTS ]
            summary: 恢复转发
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 恢复成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/forward/diagnose:
        post:
            tags: [ FTS ]
            summary: 转发诊断
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                forwardId:
                                    type: integer
                                    format: int64
                            required:
