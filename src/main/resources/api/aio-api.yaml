                    description: 删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/forward/force-delete:
        post:
            tags: [ FTS ]
            summary: 强制删除转发
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 强制删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/forward/pause:
        post:
            tags: [ FTS ]
            summary: 暂停转发
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 暂停成功
                    content:
                        application/json:
                            schema:
