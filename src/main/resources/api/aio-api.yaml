                '200':
                    description: 成功，返回节点列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/node/update:
        post:
            tags: [ FTS ]
            summary: 更新节点信息
            description: 需要管理员角色（@RequireRole）
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NodeUpdateDto'
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/node/delete:
        post:
            tags: [ FTS ]
            summary: 删除节点
            description: 需要管理员角色（@RequireRole）
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/node/install:
        post:
            tags: [ FTS ]
            summary: 获取节点安装命令
            description: 需要管理员角色（@RequireRole）
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 成功，返回安装命令等信息
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    # --------------------
    # Tunnel
