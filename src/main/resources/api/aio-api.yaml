            security:
                - bearerAuth: []
            responses:
                '200':
                    description: 成功，返回限速规则列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/speed-limit/update:
        post:
            tags: [ FTS ]
            summary: 更新限速规则
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SpeedLimitUpdateDto'
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/speed-limit/delete:
        post:
            tags: [ FTS ]
            summary: 删除限速规则
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    format: int64
                            required:
                                - id
            responses:
                '200':
                    description: 删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/speed-limit/tunnels:
        post:
            tags: [ FTS ]
            summary: 获取所有隧道（用于限速规则选择）
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            responses:
                '200':
                    description: 成功，返回隧道列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    # --------------------
    # Config
    # --------------------
    /api/fts/config/list:
        post:
            tags: [ FTS ]
            summary: 获取所有站点配置
            description: 前端无需权限即可访问
            responses:
                '200':
                    description: 成功，返回所有配置项
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/config/get:
        post:
            tags: [ FTS ]
            summary: 根据配置名获取配置值
            description: 前端无需权限即可访问
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                            required:
                                - name
            responses:
                '200':
                    description: 成功，返回对应配置值
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/config/update:
        post:
            tags: [ FTS ]
            summary: 批量更新站点配置
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties:
                                type: string
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/config/update-single:
        post:
            tags: [ FTS ]
            summary: 更新单个配置项
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                value:
                                    type: string
                            required:
                                - name
                                - value
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'
    # --------------------
    # Flow
    # --------------------
    /api/fts/flow/config:
        post:
            tags: [ FTS ]
            summary: 节点上报 GOST 配置
            description: |
                节点通过该接口上报当前 GOST 配置。
                请求体 rawData 可能是原始 JSON 或加密包裹结构（EncryptedMessage），通过 secret 进行解密。
            parameters:
                -   name: secret
                    in: query
                    required: true
                    schema:
                        type: string
                    description: 节点密钥，用于鉴权与解密
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: string
                            description: 原始数据字符串，可能为 GostConfigDto JSON 或 EncryptedMessage(JSON 包含 encrypted/data/timestamp)
            responses:
                '200':
                    description: 始终返回 "ok" 字符串
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: ok

    /api/fts/flow/test:
        get:
            tags: [ FTS ]
            summary: 测试接口
            responses:
                '200':
                    description: 返回 "test"
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: test

    /api/fts/flow/upload:
        post:
            tags: [ FTS ]
            summary: 节点上报流量数据
            description: |
                节点通过该接口上报流量统计数据。
                rawData 可能为加密或未加密的 FlowDto JSON。
            parameters:
                - name: secret
                  in: query
                  required: true
                  schema:
                      type: string
                  description: 节点密钥，用于验证节点合法性
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: string
                            description: 原始数据字符串，解析为 FlowDto 或加密结构
            responses:
                '200':
                    description: 始终返回 "ok"
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: ok
    # --------------------
    # External
    # --------------------
    /api/fts/sub_store:
        get:
            tags: [ FTS ]
            summary: 订阅信息查询（兼容外部格式）
            description: |
                对外开放的订阅流量查询接口。
                验证 user/pwd，支持可选 tunnel 参数指定用户隧道。
                校验通过后，会设置响应头 `subscription-userinfo`：
                  upload={upload}; download={download}; total={total}; expire={expire}
                同时返回 headerValue 字符串。
            parameters:
                -   name: user
                    in: query
                    required: true
                    schema:
                        type: string
                -   name: pwd
                    in: query
                    required: true
                    schema:
                        type: string
                -   name: tunnel
                    in: query
                    required: false
                    schema:
                        type: string
                        default: "-1"
            responses:
                '200':
                    description: 成功，返回 headerValue 字符串
                    headers:
                        subscription-userinfo:
                            description: 订阅用户流量信息
                            schema:
                                type: string
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: upload=0; download=0; total=0; expire=0
                '400':
                    $ref: '#/components/responses/ErrorResponse'


## models ##
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    responses:
        ErrorResponse:
            description: 统一错误响应
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ModelApiResponse'

    schemas:
        ## response
        # 通用API响应格式
        ModelApiResponse:
            type: object
            description: 统一响应包装
            required:
                - code
                - msg
                - ts
                - success
            properties:
                code:
                    type: integer
                    description: 状态码
                    example: 200
                msg:
                    type: string
                    description: 响应消息
                    example: "操作成功"
                timeStamp:
                    type: integer
                    format: int64
                    description: 响应时间戳(毫秒)
                    example: 1701747900000
                success:
                    type: boolean
                    description: 操作是否成功
                    example: true
                data:
                    description: 响应数据，具体类型根据不同API而定
                    nullable: true

        # ----------------------------------------------------
        # Captcha Data
        # ----------------------------------------------------
        CaptchaVerifyDto:
            type: object
            properties:
                id:
                    type: string
                data:
                    type: object
                    description: 滑块/点击验证码轨迹数据（ImageCaptchaTrack）
            required:
                - id
                - data

        # ----------------------------------------------------
        # User Data
        # ----------------------------------------------------
        UserLoginDataResponse:
            type: object
            properties:
                userId:
                    type: integer
                    description: User ID
                    example: "436346"
                userName:
                    type: string
                    description: User Name
                    example: "test"
                token:
                    type: string
                    description: User Token
                    example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI1Zjli"
                role:
                    type: string
                    description: User Role
                    example: "USER"

        UserRegisterRequest:
            type: object
            required:
                - userName
                - displayName
                - email
                - password
            properties:
                userName:
                    type: string
                    maxLength: 100
                displayName:
                    type: string
                    maxLength: 100
                email:
                    type: string
                    maxLength: 100
                phone:
                    type: string
                    maxLength: 100
                password:
                    type: string
                    minLength: 6
                    maxLength: 20
                gender:
                    type: string
                    default: U
                birthday:
                    type: string
                    format: date
                occupation:
                    type: string
                signature:
                    type: string

        UserLoginRequest:
            type: object
            required:
                - account
                - password
            properties:
                account:
                    type: string # username/email/phone
                password:
                    type: string
                    minLength: 6
                    maxLength: 20
                    format: password
                captchaId:
                    type: string
                    nullable: true

        UpdatePasswordRequest:
            type: object
            required:
                - oldPassword
                - newPassword
            properties:
                oldPassword:
                    type: string
                    minLength: 6
                    maxLength: 20
                    format: password
                newPassword:
                    type: string
                    minLength: 6
                    maxLength: 20
                    format: password

        UpdateUserInfoRequest:
            type: object
            description: update user info
            properties:
                userName:
                    type: string
                    maxLength: 100
                    description: user name
                displayName:
                    type: string
                    maxLength: 100
                    description: real name
                email:
                    type: string
                    maxLength: 100
                    description: email
                phone:
                    type: string
                    maxLength: 100
                    description: phone number
                occupation:
                    type: string
                    description: occupation
                signature:
                    type: string
                    description: signature

        # ----------------------------------------------------
        # FTS Data
        # ----------------------------------------------------
        FTSUserUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                flow:
                    type: integer
                    format: int64
                num:
                    type: integer
                    format: int32
                expTime:
                    type: integer
                    format: int64
                flowResetTime:
                    type: integer
                    format: int64
                status:
                    type: integer
                    format: int32
            required:
                - id
                - flow
                - num
                - expTime
                - flowResetTime

        ResetFlowDto:
            type: object
            properties:
                userId:
                    type: integer
                    format: int32
                    description: user id
                type:
                    type: integer
                    format: int32
                    description: 重置类型
            required:
                - id
                - type

        NodeUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                name:
                    type: string
                ip:
                    type: string
                serverIp:
                    type: string
                portSta:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 65535
                portEnd:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 65535
                http:
                    type: integer
                    format: int32
                    nullable: true
                tls:
                    type: integer
                    format: int32
                    nullable: true
                socks:
                    type: integer
                    format: int32
                    nullable: true
            required:
                - id
                - name
                - ip
                - serverIp
                - portSta
                - portEnd

        TunnelDto:
            type: object
            properties:
                name:
                    type: string
                inNodeId:
                    type: integer
                    format: int64
                outNodeId:
                    type: integer
                    format: int64
                    nullable: true
                    description: 可为空，type=1 时自动设置为 inNodeId
                type:
                    type: integer
                    format: int32
                    description: 隧道类型（1 端口转发，2 隧道转发）
                flow:
                    type: integer
                    format: int32
                    description: 流量计算类型（1 单向上行，2 双向）
                trafficRatio:
                    type: number
                    format: double
                    description: 流量倍率，(0, 100]
                interfaceName:
                    type: string
                    nullable: true
                protocol:
                    type: string
                    description: 协议类型，默认 tls
                tcpListenAddr:
                    type: string
                    description: TCP 监听地址，默认 0.0.0.0
                udpListenAddr:
                    type: string
                    description: UDP 监听地址，默认 0.0.0.0
            required:
                - name
                - inNodeId
                - type
                - flow
                - trafficRatio

        TunnelUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                name:
                    type: string
                flow:
                    type: integer
                    format: int32
                trafficRatio:
                    type: number
                    format: double
                protocol:
                    type: string
                tcpListenAddr:
                    type: string
                udpListenAddr:
                    type: string
                interfaceName:
                    type: string
                    nullable: true
            required:
                - id
                - name
                - flow
                - trafficRatio
                - protocol
                - tcpListenAddr
                - udpListenAddr

        UserTunnelDto:
            type: object
            properties:
                userId:
                    type: integer
                    format: int32
                tunnelId:
                    type: integer
                    format: int32
                flow:
                    type: integer
                    format: int64
                    description: 流量限制（单位：GB）
                num:
                    type: integer
                    format: int32
                    description: 转发数量限制
                flowResetTime:
                    type: integer
                    format: int64
                    description: 流量重置时间戳（毫秒）
                expTime:
                    type: integer
                    format: int64
                    description: 到期时间戳（毫秒）
                speedId:
                    type: integer
                    format: int32
                    nullable: true
                    description: 限速规则 ID，可为空表示不限速
            required:
                - userId
                - tunnelId
                - flow
                - num
                - flowResetTime
                - expTime

        UserTunnelQueryDto:
            type: object
            properties:
                userId:
                    type: integer
                    format: int32
            required:
                - userId

        UserTunnelUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int32
                flow:
                    type: integer
                    format: int64
                num:
                    type: integer
                    format: int32
                flowResetTime:
                    type: integer
                    format: int64
                expTime:
                    type: integer
                    format: int64
                status:
                    type: integer
                    format: int32
                speedId:
                    type: integer
                    format: int32
                    nullable: true
            required:
                - id
                - flow
                - num
                - flowResetTime
                - expTime
                - status

        ForwardDto:
            type: object
            properties:
                name:
                    type: string
                tunnelId:
                    type: integer
                    format: int32
                remoteAddr:
                    type: string
                    description: 远程地址
                strategy:
                    type: string
                    nullable: true
                inPort:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 65535
                    nullable: true
                    description: 可选，为空时自动分配
                interfaceName:
                    type: string
                    nullable: true
            required:
                - name
                - tunnelId
                - remoteAddr

        ForwardUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                userId:
                    type: integer
                    format: int32
                name:
                    type: string
                tunnelId:
                    type: integer
                    format: int32
                remoteAddr:
                    type: string
                strategy:
                    type: string
                    nullable: true
                inPort:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 65535
                    nullable: true
                interfaceName:
                    type: string
                    nullable: true
            required:
                - id
                - userId
                - name
                - tunnelId
                - remoteAddr

        SpeedLimitDto:
            type: object
            properties:
                name:
                    type: string
                speed:
                    type: integer
                    format: int32
                    minimum: 1
                tunnelId:
                    type: integer
                    format: int64
                tunnelName:
                    type: string
            required:
                - name
                - speed
                - tunnelId
                - tunnelName

        SpeedLimitUpdateDto:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                name:
                    type: string
                speed:
                    type: integer
                    format: int32
                    minimum: 1
                tunnelId:
                    type: integer
                    format: int64
                tunnelName:
                    type: string
            required:
                - id
                - name
                - speed
                - tunnelId
                - tunnelName




