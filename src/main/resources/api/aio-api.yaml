                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/forward/update-order:
        post:
            tags: [ FTS ]
            summary: 更新转发排序
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: |
                                参数中包含 forwards 数组，每个元素包含 id 与 inx
            responses:
                '200':
                    description: 更新排序成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    # --------------------
    # SpeedLimit
    # --------------------
    /api/fts/speed-limit/create:
        post:
            tags: [ FTS ]
            summary: 创建限速规则
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SpeedLimitDto'
            responses:
                '200':
                    description: 创建成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/speed-limit/list:
        post:
            tags: [ FTS ]
            summary: 获取限速规则列表
