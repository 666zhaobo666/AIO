openapi: 3.0.3
info:
    title: AIO API
    version: 1.0.0
    x-java-interface-name: OpenApi
tags:
    - name: User
      description: 用户管理 (UserController)
    - name: Captcha
      description: 验证码接口 (CaptchaController)
    - name: FTS
      description: FTS模块接口 (FTSController)

## endpoints ##
paths:
    # ==========================================
    # Captcha
    # ==========================================
    /api/captcha/check:
        post:
            tags: [ Captcha ]
            summary: 检查验证码是否启用
            description: |
                根据配置项 `captcha_enabled` 判断是否启用验证码。
                返回 data 为 0 表示未启用，1 表示启用。
            responses:
                '200':
                    description: 成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/captcha/generate:
        post:
            tags: [ Captcha ]
            summary: 生成验证码
            description: 根据配置的验证码类型或随机类型生成验证码。
            responses:
                '200':
                    description: 成功，返回验证码信息
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/captcha/verify:
        post:
            tags: [ Captcha ]
            summary: 验证验证码
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CaptchaVerifyDto'
            responses:
                '200':
                    description: 验证结果，成功时返回 validToken
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    # ==========================================
    # User
    # ==========================================
    # register
    /api/user/register:
        post:
            operationId: register
            summary: 用户注册
            tags: [ User ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserRegisterRequest'
            responses:
                '201':
                    description: 注册成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'

    # login
    /api/user/login:
        post:
            operationId: login
            summary: 用户登录（支持用户名/邮箱/手机号）
            tags: [ User ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserLoginRequest'
            responses:
                '200':
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'

    # change password
    /api/user/password:
        put:
            operationId: updatePassword
            summary: 修改密码（需登录）
            tags: [ User ]
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePasswordRequest'
            responses:
                '200':
                    description: 密码修改成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'

    # delete user
    /api/user/delete/{userId}:
        delete:
            operationId: deleteUser
            summary: 删除用户（管理员可删除所有用户，普通用户仅可删除自己）
            tags: [ User ]
            security:
                -   bearerAuth: [ ]
            parameters:
                -   name: userId
                    in: path
                    required: true
                    schema:
                        type: integer
            responses:
                '200':
                    description: 用户删除成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'

    # change user info
    /api/user/update/{userId}:
        put:
            operationId: updateUserInfo
            summary: 修改用户信息（普通用户仅可修改自己，管理员可修改所有用户）
            tags: [ User ]
            security:
                -   bearerAuth: [ ]
            parameters:
                -   name: userId
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserInfoRequest'
            responses:
                '200':
                    description: 用户信息修改成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
    # ==========================================
    # FTS
    # ==========================================
    # --------------------
    # User
    # --------------------
    /api/fts/user/list:
        post:
            tags: [ FTS ]
            summary: 获取用户列表
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            responses:
                '200':
                    description: 成功，data 通常为用户列表
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'
    /api/fts/user/list/{userId}:
        post:
            tags: [ FTS ]
            summary: 获取当前用户套餐信息
            security:
                -   bearerAuth: [ ]
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int32
            responses:
                '200':
                    description: 成功，返回当前登录用户的套餐信息
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    /api/fts/user/reset:
        post:
            tags: [ FTS ]
            summary: 重置用户流量/信息
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetFlowDto'
            responses:
                '200':
                    description: 重置成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'


    /api/fts/user/update:
        post:
            tags: [ FTS ]
            summary: 更新用户信息
            description: 需要管理员角色（@RequireRole）
            security:
                -   bearerAuth: [ ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FTSUserUpdateDto'
            responses:
                '200':
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ModelApiResponse'
                '400':
                    $ref: '#/components/responses/ErrorResponse'

    # --------------------
    # Node
    # --------------------
    /api/fts/node/list:
