openapi: 3.0.3
info:
  title: User Management API
  version: 1.0.0
  x-java-interface-name: UserApi

## endpoints ##
paths:
  # 注册
  /api/user/register:
    post:
      operationId: register
      summary: 用户注册
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelApiResponse'

  # 登录
  /api/user/login:
    post:
      operationId: login
      summary: 用户登录（支持用户名/邮箱/手机号）
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelApiResponse'

  # 修改密码
  /api/user/password:
    put:
      operationId: updatePassword
      summary: 修改密码（需登录）
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelApiResponse'

  # 删除用户
  /api/user/delete/{userId}:
    delete:
      operationId: deleteUser
      summary: 删除用户（管理员可删除所有用户，普通用户仅可删除自己）
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 用户删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelApiResponse'


## models ##
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ## response
    # 通用API响应格式
    ModelApiResponse:
      type: object
      required:
        - code
        - msg
        - ts
        - success
      properties:
        code:
          type: integer
          description: 状态码
          example: 200
        msg:
          type: string
          description: 响应消息
          example: "操作成功"
        ts:
          type: integer
          format: int64
          description: 响应时间戳(毫秒)
          example: 1701747900000
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          description: 响应数据，具体类型根据不同API而定
          nullable: true

    UserLoginDataResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: 用户ID
          example: "5f9b0b0b0b0b0b0b0b0b0b0b"
        userName:
          type: string
          description: 用户名
          example: "test"
        token:
          type: string
          description: 用户登录凭证
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI1Zjli"
        role:
          type: string
          description: 用户角色
          example: "USER"

    ## request
    UserRegisterRequest:
      type: object
      required:
        - username
        - name
        - email
        - password
      properties:
        username:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 100
        gender:
          type: string
          default: U
        birthday:
          type: string
          format: date
        occupation:
          type: string
        signature:
          type: string

    UserLoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string # 用户名/邮箱/手机号
        password:
          type: string
          format: password

    UpdatePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          minLength: 8
          format: password

