# 应用基础配置
spring:
  application:
    name: aio-platform  # 应用名称
  profiles:
    active: dev  # 默认激活开发环境（可改为prod切换到生产环境）
  # 公共配置（如JPA基础配置，不同环境可覆盖）
  jpa:
    open-in-view: false  # 关闭OpenSessionInView模式（避免事务问题）
    properties:
      hibernate:
        format_sql: true  # SQL格式化（所有环境通用）
        dialect: org.hibernate.dialect.PostgreSQLDialect  # PostgreSQL方言

# 服务器配置（公共部分）
# 注意：不要再设置 context-path，因为 OpenAPI 已经在路径中包含 /api 前缀
# server:
#   servlet:
#     context-path: /

# 自定义配置（如JWT、业务参数等）
aio:
  jwt:
    secret: aio-platform-jwt-secret-key-1234567890  # JWT密钥（生产环境需更换为复杂密钥）
    expire-days: 7  # 令牌过期时间（天）