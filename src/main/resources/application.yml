# 应用基础配置
spring:
  application:
    name: aio-platform  # 应用名称
  profiles:
    active: dev  # 默认激活开发环境（可改为prod切换到生产环境）
  # 公共配置（如JPA基础配置，不同环境可覆盖）
  jpa:
    open-in-view: false  # 关闭OpenSessionInView模式（避免事务问题）
    properties:
      hibernate:
        format_sql: true  # SQL格式化（所有环境通用）
        dialect: org.hibernate.dialect.PostgreSQLDialect  # PostgreSQL方言