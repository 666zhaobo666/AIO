spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: false

aio:
  jwt:
    secret: test-jwt-secret-key-for-unit-testing-minimum-32-chars
    expire-days: 7

logging:
  level:
    root: WARN
    com.aio: DEBUG

